[platformio]
default_envs = rp2350

[env:rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; Match the smoke-test profile that runs on Centipede 32z (RP2350B).
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 250000000L

monitor_speed = 115200
; Don't toggle DTR/RTS on connect — that resets the Pico and causes reconnect loops.
monitor_dtr = 0
monitor_rts = 0

build_flags = 
    -D CORE_DEBUG_LEVEL=5
    -D ARDUINO_USB_MODE=1
    ; Defer USB init until Serial.begin — core1 can serve the CoCo bus sooner.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -DPICO_RP2350A=0

build_src_filter = +<*> -<../src_esp32/> -<serial_smoke.cpp>

[env:rp2350_romtest]
extends = env:rp2350
build_src_filter = -<*> +<rom_serve_test.cpp> +<disk11_wrap.cpp>
build_flags =
    ${env:rp2350.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -DPICO_COPY_TO_RAM=1
    -I../../../copico-bonobo-main/v3.1-centipede/centipede-watcher

; Try this if J6 is wired direct (pins 1-2 and 5-6) instead of schmitt inverted.
[env:rp2350_j6direct]
extends = env:rp2350
build_flags =
    ${env:rp2350.build_flags}
    -DCENTIPEDE_J6_DIRECT=1

[env:rp2350_smoke]
extends = env:rp2350
board = generic_rp2350
build_flags =
    ${env:rp2350.build_flags}
    -DPICO_RP2350A=0
board_build.f_cpu = 150000000L
build_src_filter = -<*> +<serial_smoke.cpp>

[env:esp32c3_coprocessor]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<../src_esp32/> -<*>
lib_deps =
    ModemEngine
    greiman/SdFat@^2.2.3
build_flags =
    -DSPI_DRIVER_SELECT=2
